<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">10.1.4<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>Four isobaric surfaces corresponding to pressure levels <span class="process-math">\(p_0 = 90 \, \text{kPa}\text{,}\)</span> <span class="process-math">\(p_1 = 80 \, \text{kPa}\text{,}\)</span> <span class="process-math">\(p_2 = 70 \, \text{kPa}\text{,}\)</span> and <span class="process-math">\(p_3 = 60 \, \text{kPa}\text{,}\)</span> where <span class="process-math">\(1 \, \text{kPa} = 10 \, \text{hPa}\text{.}\)</span> Darker brown shading of the surfaces corresponds to higher pressure. A horizontal temperature gradient similar to Earth’s meridional temperature gradient in the Northern Hemisphere, with cooler air to the north in the polar regions and warmer air to the south in the tropics, causes the isobaric surfaces to increasingly tilt upward with increasing height toward the tropics due to increasing thickness with increasing height. Greater tilt of an isobaric surface creates a stronger horizontal pressure gradient force, which drives a stronger zonal geostrophic wind <span class="process-math">\(u_g\text{,}\)</span> as plotted with black vectors for the Northern Hemisphere. Figure and caption modified from Fig. 11.20 of <a href="references.html#stull" class="xref" data-knowl="./knowl/xref/stull.html" data-reveal-label="Reveal" data-close-label="Close" title="Bibliographic Entry 11.9: Practical Meteorology: An Algebra-based Survey of Atmospheric Science">[Stull (2017)]</a> under <a class="external" href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank">CC BY-NC-SA 4.0</a>.<div class="autopermalink" data-description="Figure 10.1.4"><a href="#ch10-thermal-wind-stull" title="Copy heading and permalink for Figure 10.1.4" aria-label="Copy
